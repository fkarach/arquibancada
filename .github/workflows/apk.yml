name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "dados/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Sem chave própria configurada, o app é assinado com a chave de depuração,
      # guardada em cache para que as atualizações instalem por cima.
      - name: Reaproveitar chave de depuração
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arquibancada-debug-keystore-v1

      - name: Preparar chave própria (se configurada)
        env:
          ARQ_KEYSTORE_BASE64: ${{ secrets.ARQ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ARQ_KEYSTORE_BASE64" ]; then
            echo "$ARQ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arquibancada.jks"
            echo "ARQ_KEYSTORE_PATH=$RUNNER_TEMP/arquibancada.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        env:
          ARQ_KEYSTORE_PASSWORD: ${{ secrets.ARQ_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Preparar arquivo
        run: cp app/build/outputs/apk/release/app-release.apk Arquibancada.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Arquibancada 0.1.${{ github.run_number }}
          body: "Baixe o Arquibancada.apk abaixo no celular e instale."
          files: Arquibancada.apk
          make_latest: true
