name: Seguir (pedido do app)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  aplicar:
    # Só o dono do repositório pode mudar o que é seguido.
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Arquibancada:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar pedido
        id: aplicar
        run: python3 scripts/seguir.py

      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/seguindo.json
          git diff --cached --quiet && exit 0
          git commit -m "Seguir: pedido #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Responder e fechar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          RESULTADO: ${{ steps.aplicar.outcome }}
        run: |
          if [ "$RESULTADO" = "success" ]; then
            gh issue comment "$NUMERO" -R "$GITHUB_REPOSITORY" --body-file resposta.txt
          else
            gh issue comment "$NUMERO" -R "$GITHUB_REPOSITORY" --body "Não consegui aplicar este pedido. Confira o texto ou peça no chat."
          fi
          gh issue close "$NUMERO" -R "$GITHUB_REPOSITORY"
